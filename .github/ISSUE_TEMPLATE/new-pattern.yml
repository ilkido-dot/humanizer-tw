name: 新的痕跡
description: 一種現有模式都抓不到的 AI 寫作痕跡。
labels: ["enhancement"]
body:
  - type: textarea
    id: before
    attributes:
      label: 例子
      description: 呈現這個痕跡的真實文字。請先拿掉私人資訊。
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 人會怎麼寫
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 為什麼現有模式抓不到
      description: 寫出最接近的現有模式，並說明它為什麼漏掉這個痕跡。大多數新的痕跡都能併入現有模式。
    validations:
      required: true
